[project]
name = "agent-retrieval-service"
version = "0.1.0"
description = "Hybrid retrieval exposed as an MCP tool and a streaming API, with a measured evaluation on SciFact and infrastructure as code."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.2", "pyarrow>=15", "faiss-cpu>=1.8", "sentence-transformers>=3.0", "fastapi>=0.110", "httpx>=0.27", "mcp>=1.2,<2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
